[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esim-mcp"
version = "0.1.0"
description = "MCP server exposing eSIM platform authentication to MCP clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
    "ruff>=0.6",
]

[project.scripts]
esim-mcp = "esim_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esim_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["esim_mcp", "app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
